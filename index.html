    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-glow: rgba(255, 69, 0, 0.6);
            --border-color: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.12);
            
            --tg-color: #0088cc;
            --yt-color: #ff0000;
            --tt-cyan: #00f2fe;
            --tt-magenta: #fe0979;
            --donate-color: #ffaa00;
            
            --radius-lg: 30px;
            --radius-md: 18px;
            --radius-sm: 16px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 69, 0, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 136, 204, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 50% 0%, var(--bg-secondary) 0%, var(--bg-primary) 80%);
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.5;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(25, 25, 36, 0.4);
            border-radius: var(--radius-lg);
            padding: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* ===== AVATAR ===== */
        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px var(--accent-glow);
            animation: float 4s ease-in-out infinite;
            will-change: transform;
            display: block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== TITLE ===== */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            text-align: center;
            font-weight: 800;
        }

        /* ===== LINKS ===== */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.06);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Touch feedback */
        .link-btn:active {
            transform: scale(0.97);
        }

        .link-btn i {
            font-size: 2.2rem;
            margin-right: 20px;
            transition: transform var(--transition);
            width: 45px;
            text-align: center;
            flex-shrink: 0;
        }

        .link-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .link-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .link-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Hover effects (desktop only) */
        @media (hover: hover) {
            .link-btn:hover {
                transform: translateY(-3px);
            }
            .link-btn:hover i {
                transform: scale(1.15);
            }
            
            .tg-btn:hover {
                border-color: var(--tg-color);
                background: rgba(0, 136, 204, 0.1);
            }
            .tg-btn:hover i { color: var(--tg-color); }
            
            .yt-btn:hover {
                border-color: var(--yt-color);
                background: rgba(255, 0, 0, 0.1);
            }
            .yt-btn:hover i { color: var(--yt-color); }
            
            .tt-btn:hover {
                border-color: var(--tt-cyan);
                background: rgba(255, 255, 255, 0.08);
            }
            .tt-btn:hover i {
                background: linear-gradient(45deg, var(--tt-cyan), var(--tt-magenta));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            .donate-btn:hover {
                border-color: var(--donate-color);
                background: rgba(255, 170, 0, 0.1);
            }
            .donate-btn:hover i { color: var(--donate-color); }
        }

        /* ===== SPONSOR ===== */
        .sponsor-block {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.09) 100%);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .sponsor-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sponsor-link {
            display: inline-block;
            transition: opacity var(--transition);
        }
        
        .sponsor-link:hover {
            opacity: 0.8;
        }

        .sponsor-img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 10px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }
            
            .container {
                padding: 20px 15px;
                background: transparent;
                box-shadow: none;
                border: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            
            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }
            
            .avatar {
                border-width: 3px;
            }
            
            h1 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            
            .links-container {
                gap: 12px;
                margin-bottom: 20px;
            }
            
            .link-btn {
                padding: 12px 15px;
                border-radius: 14px;
            }
            
            .link-btn i {
                font-size: 1.8rem;
                margin-right: 15px;
                width: 35px;
            }
            
            .link-title {
                font-size: 0.95rem;
            }
            
            .link-subtitle {
                font-size: 0.75rem;
            }
            
            .sponsor-block {
                padding: 15px 12px;
            }
            
            .sponsor-img {
                max-height: 70px;
            }

            /* Mobile icon colors */
            .tg-btn i { color: #55b4e6; }
            .yt-btn i { color: #ff4d4d; }
            .tt-btn i { 
                color: #ffffff;
                text-shadow: -1px -1px 0 var(--tt-cyan), 1px 1px 0 var(--tt-magenta);
            }
            .donate-btn i { color: #ffd166; }
        }

        /* ===== UTILITY ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
