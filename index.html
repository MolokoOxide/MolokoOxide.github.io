    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-primary: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #e4e4e7;
            
            --tg-color: #55b4e6;
            --yt-color: #ff4d4d;
            --tt-cyan: #00f2fe;
            --tt-magenta: #fe0979;
            --donate-color: #ffd166;
            
            --radius-lg: 32px;
            --radius-md: 16px; /* Унифицированный радиус для всех устройств */
            --transition: 0.3s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ЖИВОЙ ФОН: РАЗМЫТИЕ И АНИМАЦИЯ ===== */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-image: url('https://art.playoxide.com/assets/desktop-06.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(4px);
            animation: bgBreathe 20s ease-in-out infinite alternate;
        }

        @keyframes bgBreathe {
            0% { transform: scale(1.03); }
            100% { transform: scale(1.12); }
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: rgba(0, 0, 0, 0.55); 
        }

        /* ===== CONTAINER (Глассморфизм) ===== */
        .container {
            max-width: 540px;
            width: 100%;
            background: linear-gradient(180deg, rgba(30, 30, 42, 0.65) 0%, rgba(20, 20, 28, 0.45) 100%);
            border-radius: var(--radius-lg);
            padding: 45px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px; /* Унифицированный размер */
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            animation: floatAvatar 5s ease-in-out infinite;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); }
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* ===== LINKS (ЕДИНЫЙ ДИЗАЙН ДЛЯ ПК И ТЕЛЕФОНОВ) ===== */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08); /* Единый фон */
            padding: 14px 18px; /* Единые отступы */
            border-radius: var(--radius-md);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .link-btn i {
            font-size: 1.8rem; /* Единый размер иконок */
            margin-right: 15px;
            width: 35px;
            text-align: center;
            transition: var(--transition);
        }

        /* Цвета иконок по умолчанию (теперь одинаково везде) */
        .tg-btn i { color: var(--tg-color); }
        .yt-btn i { color: var(--yt-color); }
        .tt-btn i { color: #fff; text-shadow: -1px -1px 0 var(--tt-cyan), 1px 1px 0 var(--tt-magenta); }
        .donate-btn i { color: var(--donate-color); }

        .link-content {
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .link-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        /* Hover эффекты (сработают только там, где поддерживается мышь) */
        @media (hover: hover) {
            .link-btn:hover {
                transform: translateY(-3px);
                background: rgba(255, 255, 255, 0.12);
            }
            .tg-btn:hover { border-color: var(--tg-color); box-shadow: 0 8px 15px rgba(85, 180, 230, 0.2); }
            .tg-btn:hover i { transform: scale(1.1); }
            
            .yt-btn:hover { border-color: var(--yt-color); box-shadow: 0 8px 15px rgba(255, 77, 77, 0.2); }
            .yt-btn:hover i { transform: scale(1.1); }
            
            .tt-btn:hover { border-color: var(--tt-cyan); box-shadow: 0 8px 15px rgba(0, 242, 254, 0.2); }
            .tt-btn:hover i { transform: scale(1.1); }
            
            .donate-btn:hover { border-color: var(--donate-color); box-shadow: 0 8px 15px rgba(255, 209, 102, 0.2); }
            .donate-btn:hover i { transform: scale(1.1); }
        }
        
        .link-btn:active { transform: scale(0.97); }

        /* ===== SPONSOR ===== */
        .sponsor-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .sponsor-block:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .sponsor-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 1.5px;
        }

        .sponsor-img {
            max-width: 100%;
            height: auto;
            max-height: 90px;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .sponsor-link:hover .sponsor-img {
            transform: scale(1.03);
        }

        /* ===== ENTRANCE ANIMATIONS ===== */
        .animate-up {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }

        /* ===== MOBILE ONLY (Осталось только необходимое) ===== */
        @media (max-width: 600px) {
            body { padding: 0; }
            
            /* СМЕНА ФОНА НА МОБИЛЬНЫЙ */
            .bg-image {
                background-image: url('https://art.playoxide.com/assets/m-02.jpg');
            }

            /* Убираем стеклянный контейнер на телефонах для экономии места */
            .container {
                padding: 40px 20px;
                border-radius: 0;
                border: none;
                background: transparent;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            
            .avatar-wrapper { width: 110px; height: 110px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
